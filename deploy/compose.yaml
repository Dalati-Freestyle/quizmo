services:
  quizmo:
    build:
      context: ..
    environment:
      PUBLIC_ORIGIN: https://${QUIZMO_DOMAIN:?Set QUIZMO_DOMAIN in .env}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:size=16m,noexec,nosuid]
    mem_limit: 1g
    cpus: 2
    pids_limit: 128
    networks: [backend]
  caddy:
    image: caddy:2.10.2-alpine
    environment:
      QUIZMO_DOMAIN: ${QUIZMO_DOMAIN:?Set QUIZMO_DOMAIN in .env}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks: [backend]
networks:
  backend:
volumes:
  caddy_data:
  caddy_config:
